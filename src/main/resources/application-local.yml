# =============================================================================
# application-local.yml — Perfil de desarrollo local (Orchestrator)
# =============================================================================
#
# Activar con: ./gradlew bootRun --args='--spring.profiles.active=local'
#
# En este perfil:
#   ✅ Servidor Tomcat activo (puerto 8084)
#   ✅ Swagger UI: http://localhost:8084/swagger-ui.html
#   ✅ InMemoryWorkflowAdapter (sin Step Functions real)
#   ❌ Sin conexion a AWS
# =============================================================================

spring:
  main:
    web-application-type: servlet

server:
  port: 8084

logging:
  level:
    com.msgpipeline: DEBUG
    org.springframework: INFO
    software.amazon.awssdk: OFF
